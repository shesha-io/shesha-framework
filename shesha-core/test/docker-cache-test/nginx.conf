# Load balancer for the throughput test (T7) ONLY.
#
# The coherence tests address instances directly on 21021/21022/21023 — routing them
# through a round-robin balancer would make "did instance B see the write?" unanswerable.

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # $upstream_addr identifies which instance served each request — needed to confirm the
    # load actually spread across all three.
    log_format upstream '$remote_addr [$time_local] "$request" $status '
                        'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log upstream;
    error_log  /var/log/nginx/error.log warn;

    # Compression off: it would distort the latency measurements this profile exists to take.
    gzip off;

    upstream sha_cluster {
        server api-1:8080 max_fails=3 fail_timeout=30s;
        server api-2:8080 max_fails=3 fail_timeout=30s;
        server api-3:8080 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://sha_cluster;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Empty Connection header enables upstream keepalive.
            proxy_set_header Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_buffering on;
            proxy_max_temp_file_size 0;
        }
    }
}
