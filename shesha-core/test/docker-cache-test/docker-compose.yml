# Multi-instance cache coherence test rig.
#
# Three API instances + one Redis, all sharing the host's local SQL Server.
#
# Each instance is published on its OWN host port (22021/22022/22023). This is deliberate:
# cache-coherence tests must control which instance answers a request, so the nginx load
# balancer is NOT in the default path. It lives behind the `loadtest` profile and is used
# only for the throughput test (T7).
#
# Bring the stack up with ./up.ps1 (sequences the cold-start migration correctly).

name: sha-cache-test

x-api-common: &api-common
  image: sha-cache-test-api:local
  environment: &api-env
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://+:8080
    # Defaults to the SQL container in this stack. Override SHA_DB_CONNECTION in .env to point
    # at your own SQL Server instead.
    ConnectionStrings__Default: ${SHA_DB_CONNECTION:-Data Source=sql,1433;Initial Catalog=SheshaFunctionalTests;User Id=sa;Password=Cache@Test1;TrustServerCertificate=True;Encrypt=False;}
    SheshaRedis__ConnectionString: redis:6379
    SheshaRedis__DatabaseId: "0"
    # Pinned identically across all three instances so a token minted by one validates on
    # the others. The test suite asserts this — config drift here would otherwise surface
    # as a phantom "cache incoherence" failure.
    Authentication__JwtBearer__SecurityKey: ZQJK9FR81M9NDCKX161B2L9RXDBHL7GS
    Authentication__JwtBearer__Issuer: Shesha
    Authentication__JwtBearer__Audience: Shesha
    # Hangfire workers on three instances mean duplicate scheduled-job execution and
    # background noise in the throughput numbers. Off for measurement cleanliness.
    Hangfire__Enabled: "false"
    DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    redis:
      condition: service_healthy
    sql-init:
      condition: service_completed_successfully
  networks:
    - sha-cache-net
  restart: "no"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # SQL Server for the stack. Deliberately has NO volume: every `up` starts from a pristine
  # database, so a test run can never be polluted by a previous one. The fast dev loop is
  # `publish.ps1` + `docker compose restart api-1 api-2 api-3`, which does not touch SQL.
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sha-cache-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Cache@Test1"
      MSSQL_PID: Developer
    ports:
      - "21433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - sha-cache-net

  # Imports shesha-functional-tests/database/*.bacpac once, then exits. A bacpac cannot be
  # RESTOREd, so this carries sqlpackage rather than customising the SQL image.
  sql-init:
    build:
      context: ./sql-init
      dockerfile: Dockerfile
    image: sha-cache-test-sql-init:local
    container_name: sha-cache-sql-init
    environment:
      SQL_HOST: sql
      SQL_PASSWORD: "Cache@Test1"
      DB_NAME: SheshaFunctionalTests
    volumes:
      # The bacpac stays with the functional-test app, which is what produced it.
      - ../../../shesha-functional-tests/database:/bacpac:ro
    depends_on:
      sql:
        condition: service_healthy
    networks:
      - sha-cache-net
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: sha-cache-redis
    # Exposed to the host for direct inspection (redis-cli / StackExchange.Redis): key counts,
    # payload sizes, and injecting old-format values for the wire-format test (T8).
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - sha-cache-net

  # Instance 1 owns the cold-start migration. up.ps1 starts it alone and waits for it to
  # become responsive before starting 2 and 3.
  api-1:
    <<: *api-common
    container_name: sha-cache-api-1
    # Only api-1 declares `build`. All three share one image tag, and up.ps1 always starts
    # api-1 first, so the image is built exactly once. api-2/api-3 depend on api-1 so that a
    # plain `docker compose up` also works without a missing-image pull error.
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "22021:8080"
    environment:
      <<: *api-env
      INSTANCE_ID: api-1
      App__ServerRootAddress: http://localhost:22021
    volumes:
      # Shared publish output (rebuild = publish.ps1 + `docker compose restart`).
      - ./publish:/app
      # Isolated App_Data per instance: log4net writes App_Data/Logs relative to
      # /app, and three containers sharing one bind mount would interleave writes.
      - api1-appdata:/app/App_Data

  # Instances 2 and 3 skip migration/bootstrapping entirely. The framework already guards
  # seeding with a Redis distributed lock (SheshaNHibernateModule.cs:268), but that lock
  # only waits 10s and a cold migration takes far longer — hence explicit sequencing.
  api-2:
    <<: *api-common
    container_name: sha-cache-api-2
    ports:
      - "22022:8080"
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
      App__ServerRootAddress: http://localhost:22022
      skipMigrations: "true"
      skipBootstrappers: "true"
    depends_on:
      redis:
        condition: service_healthy
      sql-init:
        condition: service_completed_successfully
      api-1:
        condition: service_started
    volumes:
      # Shared publish output (rebuild = publish.ps1 + `docker compose restart`).
      - ./publish:/app
      # Isolated App_Data per instance: log4net writes App_Data/Logs relative to
      # /app, and three containers sharing one bind mount would interleave writes.
      - api2-appdata:/app/App_Data

  api-3:
    <<: *api-common
    container_name: sha-cache-api-3
    ports:
      - "22023:8080"
    environment:
      <<: *api-env
      INSTANCE_ID: api-3
      App__ServerRootAddress: http://localhost:22023
      skipMigrations: "true"
      skipBootstrappers: "true"
    depends_on:
      redis:
        condition: service_healthy
      sql-init:
        condition: service_completed_successfully
      api-1:
        condition: service_started
    volumes:
      # Shared publish output (rebuild = publish.ps1 + `docker compose restart`).
      - ./publish:/app
      # Isolated App_Data per instance: log4net writes App_Data/Logs relative to
      # /app, and three containers sharing one bind mount would interleave writes.
      - api3-appdata:/app/App_Data

  # Load balancer — throughput test only. Not used by the coherence tests.
  nginx:
    image: nginx:alpine
    container_name: sha-cache-nginx
    profiles: ["loadtest"]
    ports:
      - "22020:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
    networks:
      - sha-cache-net

networks:
  sha-cache-net:
    driver: bridge

volumes:
  api1-appdata:
  api2-appdata:
  api3-appdata:
